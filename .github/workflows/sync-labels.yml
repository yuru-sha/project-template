name: Sync shared labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/labels.json"
      - "scripts/sync-labels.py"
      - ".github/workflows/sync-labels.yml"

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-labels.py --repo "${{ github.repository }}"
